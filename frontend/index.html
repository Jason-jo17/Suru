<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>District Jury Dashboard | Laya AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <main class="dashboard-container">
        <header class="header">
            <div class="logo">
                <div class="logo-icon"></div>
                <h1>District Jury Dashboard <span>Powered by Laya AI</span></h1>
            </div>
            <div class="user-profile">
                <div class="avatar">DJ</div>
                <span>District Jury #4</span>
            </div>
        </header>

        <section class="stats-row">
            <div class="stat-card glass-panel">
                <h3>Total Evaluated</h3>
                <div class="stat-value" id="stat-total">0</div>
            </div>
            <div class="stat-card glass-panel">
                <h3>Shortlisted (Top 1000)</h3>
                <div class="stat-value text-green" id="stat-shortlisted">0</div>
            </div>
            <div class="stat-card glass-panel">
                <h3>Needs Calibration</h3>
                <div class="stat-value text-amber" id="stat-calibration">0</div>
            </div>
        </section>

        <section class="candidates-section">
            <div class="section-header">
                <h2>Recent AI Evaluations</h2>
                <div class="filters">
                    <button class="filter-btn active" data-filter="all">All</button>
                    <button class="filter-btn" data-filter="calibration">Needs Calibration</button>
                    <button class="filter-btn" data-filter="shortlist">Shortlisted</button>
                </div>
            </div>
            
            <div class="grid-container" id="candidates-grid">
                <!-- Candidate Cards injected via JS -->
            </div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
